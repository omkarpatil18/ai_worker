# Table-top manipulation start pose for FFW SG2 (captured from the real robot, 2026-08-27).
# Same structure as ffw_sg2_follower_initial_positions.yaml. Use via
#   ros2 launch ffw_bringup ffw_sg2_follower_ai.launch.py init_position_file:=tabletop_manip_position.yaml
# or Cyclo Manager -> Parameter Setup -> Init Position File.
# All joints are inside the cyclo_control model limits (movej start causes no self-motion).
/**:
  arm_l_joint_trajectory_executor:
    ros__parameters:
      joint_names:
        - arm_l_joint1
        - arm_l_joint2
        - arm_l_joint3
        - arm_l_joint4
        - arm_l_joint5
        - arm_l_joint6
        - arm_l_joint7
        - gripper_l_joint1
      step_names: [home]
      home: [-1.2994, 0.4105, -2.3000, -0.7982, 2.0193, 0.7225, 0.1107, 0.2577]
      duration: 5.0
      position_tolerance: 0.1
      velocity_tolerance: 0.01
      action_topic: '/arm_l_controller/follow_joint_trajectory'
      joint_states_topic: '/joint_states'

/**:
  arm_r_joint_trajectory_executor:
    ros__parameters:
      joint_names:
        - arm_r_joint1
        - arm_r_joint2
        - arm_r_joint3
        - arm_r_joint4
        - arm_r_joint5
        - arm_r_joint6
        - arm_r_joint7
        - gripper_r_joint1
      step_names: [home]
      home: [-1.2994, -0.4105, 2.3000, -0.7982, -2.0193, 0.7225, -0.1107, 0.2577]
      duration: 5.0
      position_tolerance: 0.1
      velocity_tolerance: 0.01
      action_topic: '/arm_r_controller/follow_joint_trajectory'
      joint_states_topic: '/joint_states'

/**:
  head_joint_trajectory_executor:
    ros__parameters:
      joint_names:
        - head_joint1
        - head_joint2
      step_names: [home]
      home: [0.7563, 0.0077]
      duration: 5.0
      position_tolerance: 0.1
      velocity_tolerance: 0.01
      action_topic: '/head_controller/follow_joint_trajectory'
      joint_states_topic: '/joint_states'

/**:
  lift_joint_trajectory_executor:
    ros__parameters:
      joint_names:
        - lift_joint
      step_names: [home]
      home: [-0.0852]
      duration: 10.0
      position_tolerance: 0.1
      velocity_tolerance: 0.01
      action_topic: '/lift_controller/follow_joint_trajectory'
      joint_states_topic: '/joint_states'

/**:
  swerve_steering_joint_trajectory_executor:
    ros__parameters:
      joint_names:
        - left_wheel_steer
        - right_wheel_steer
        - rear_wheel_steer
      step_names: [home]
      home: [0.0, 0.0, 0.0]
      duration: 10.0
      position_tolerance: 0.1
      velocity_tolerance: 0.01
      action_topic: '/swerve_steering_initial_position_controller/follow_joint_trajectory'
      joint_states_topic: '/joint_states'
